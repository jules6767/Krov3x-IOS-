<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Krov3x OS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--page:#e9e9ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0a0a0a}}
:root[data-theme="dark"]{--page:#0a0a0a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--page);display:grid;place-items:center;font-family:Inter,-apple-system,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;overflow:hidden}
button,input,textarea{font-family:inherit}
.phone{position:relative;width:min(390px,100vw);height:min(844px,100%);border-radius:54px;overflow:hidden;box-shadow:0 0 0 10px #111,0 0 0 11px #3a3a3c,0 40px 90px rgba(0,0,0,.45);--fg:#fff;--inv:#000;--g:rgba(255,255,255,.13);--g2:rgba(255,255,255,.24);--ln:rgba(255,255,255,.14);color:var(--fg)}
.phone.light{--fg:#000;--inv:#fff;--g:rgba(0,0,0,.07);--g2:rgba(0,0,0,.14);--ln:rgba(0,0,0,.1)}
@media(max-width:430px){.phone{border-radius:0;box-shadow:none;height:100%}}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:112px;height:32px;background:#000;border:0;border-radius:20px;z-index:9;cursor:pointer}
.status{position:absolute;top:0;left:0;right:0;height:54px;padding:18px 34px 0;display:flex;justify-content:space-between;font-size:15px;font-weight:600;z-index:8;pointer-events:none}
.screen{position:absolute;inset:0;padding:58px 0 40px;overflow:auto;scrollbar-width:none;animation:in .35s cubic-bezier(.2,.8,.2,1)}
.screen::-webkit-scrollbar{display:none}
@keyframes in{from{opacity:0;transform:scale(.96)}}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--fg);opacity:.85;z-index:9;cursor:pointer}
.homebar::after{content:"";position:absolute;inset:-12px -10px}
.glass{background:var(--g);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border:1px solid var(--ln);border-radius:26px}
svg{width:100%;height:100%}
.ctr{display:flex;flex-direction:column;align-items:center;padding:30px 28px;text-align:center}
.ctr input{margin:6px 0}
h1{font-size:34px;margin:14px 0 4px;letter-spacing:-.6px}
.sub{opacity:.6;margin:0 0 18px;text-align:center}
.logo{width:76px;height:76px;padding:19px;border-radius:22px;background:var(--g);border:1px solid var(--ln)}
input,textarea{width:100%;padding:15px 18px;border-radius:16px;border:1px solid var(--ln);background:var(--g);color:var(--fg);font-size:16px;outline:0}
::placeholder{color:var(--fg);opacity:.45}
textarea{height:340px;resize:none;border-radius:20px}
.pri{width:100%;padding:15px;border-radius:16px;border:0;background:var(--fg);color:var(--inv);font-size:16px;font-weight:600;cursor:pointer}
.pri.o{background:var(--g2);color:var(--fg)}
.pri:active,.sm:active{opacity:.7}
.sm{padding:8px 16px;border-radius:99px;border:0;background:var(--fg);color:var(--inv);font-size:13px;font-weight:600;cursor:pointer}
.sm.o{background:var(--g2);color:var(--fg)}
.bar{display:flex;gap:10px;margin-top:14px}.bar .pri{flex:1}
.sw{display:flex;gap:16px;justify-content:center;margin:16px 0}
.sw i{width:38px;height:38px;border-radius:50%;border:2px solid var(--ln);cursor:pointer}
.sw i.on{outline:2px solid var(--fg);outline-offset:3px}
.err{text-align:center;opacity:.65;font-size:13px;min-height:18px;margin-top:8px}
.lk{display:flex;flex-direction:column;align-items:center;height:100%}
.ld{margin-top:26px;font-size:19px;font-weight:500;opacity:.8;text-transform:capitalize}
.lt{font-size:96px;font-weight:200;letter-spacing:-3px;line-height:1}
.hi{margin-top:30px;opacity:.8}
.dots{display:flex;gap:14px;margin:18px 0 4px;height:14px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--fg)}
.dots i.f{background:var(--fg)}
.sh{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px;margin-top:auto;margin-bottom:14px}
.pad button{height:76px;border-radius:50%;border:0;background:var(--g);color:var(--fg);font-size:30px;font-weight:300;cursor:pointer;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.pad button:active{background:var(--g2)}
.hm{padding:8px 22px}
.wd{padding:20px 22px;margin-bottom:26px}
.wdd{text-transform:capitalize;opacity:.7;font-size:14px}
.wt{font-size:60px;font-weight:200;letter-spacing:-2px;line-height:1.1}
.wf{display:flex;justify-content:space-between;align-items:center;margin-top:8px;opacity:.95}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px}
.app{background:none;border:0;color:var(--fg);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:11px}
.ic{width:62px;height:62px;padding:16px;border-radius:19px;background:var(--g);border:1px solid var(--ln);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:transform .15s}
.app:active .ic{transform:scale(.88)}
.dock{position:absolute;left:16px;right:16px;bottom:34px;padding:14px 10px;border-radius:34px;display:flex;justify-content:space-around;z-index:5}
.dock small{display:none}
.hd{padding:6px 22px 12px}
.bk{background:none;border:0;color:var(--fg);opacity:.7;font-size:16px;padding:6px 0;cursor:pointer}
.hd h2{font-size:34px;margin:2px 0 0;letter-spacing:-.6px}
.list{margin:0 18px 16px;overflow:hidden}
.pd{padding:16px}
.pd input{margin:6px 0}
label{font-size:12px;opacity:.6;text-transform:uppercase;letter-spacing:.6px}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:13px 16px;background:none;border:0;border-bottom:1px solid var(--ln);color:var(--fg);font-size:inherit;cursor:pointer}
.row:last-child{border-bottom:0}
.tx{flex:1;text-align:left}.tx b{display:block;font-weight:600}.tx small{opacity:.6;font-size:12.5px}
.ic2{width:42px;height:42px;padding:10px;border-radius:12px;background:var(--g2)}
em{opacity:.5;font-size:13px;font-style:normal}
.cd{font-size:64px;font-weight:300;text-align:right;padding:24px 26px 10px;min-height:110px;white-space:nowrap;overflow:hidden}
.ck{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 18px}
.ck button{aspect-ratio:1;border-radius:50%;border:0;font-size:28px;font-weight:300;background:var(--g2);color:var(--fg);cursor:pointer}
.ck button.o{background:var(--fg);color:var(--inv)}
.ck button:active{opacity:.6}
.cr{font-size:68px;font-weight:200;text-align:center;margin:70px 0 10px;font-variant-numeric:tabular-nums}
.big{font-size:26px;font-weight:600;text-align:center;margin-top:30px;min-height:40px}
.pd2{padding:10px 28px;text-align:center}.pd2 input{margin:8px 0 12px}
.tt{display:grid;grid-template-columns:repeat(3,92px);gap:10px;justify-content:center;margin-top:10px}
.tt button{height:92px;border-radius:22px;border:1px solid var(--ln);background:var(--g);color:var(--fg);font-size:46px;font-weight:200;cursor:pointer}
.pd3{padding:0 28px}
.boot{position:absolute;inset:0;background:#000;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;color:#fff;transition:opacity .6s}
.boot.off{opacity:0;pointer-events:none}
.bl{font-size:30px;font-weight:200;letter-spacing:10px;animation:fi 1.4s ease both;display:flex;flex-direction:column;align-items:center;gap:18px}
@keyframes fi{from{opacity:0;transform:scale(.9)}}
.bl b{font-weight:700}
.bb{width:150px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden}
.bb i{display:block;height:100%;width:0;background:#fff;border-radius:2px;transition:width .6s ease}
@keyframes ldg{to{width:100%}}
@keyframes pu{50%{opacity:.5}}
.vd{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gl{font-size:46px;font-weight:600;letter-spacing:-2px;margin:10px 0 18px}
.tk{position:absolute;inset:0;overflow:auto;scroll-snap-type:y mandatory;scrollbar-width:none;background:#000;color:#fff;z-index:2}
.tk::-webkit-scrollbar{display:none}
.sl{position:relative;height:100%;scroll-snap-align:start;overflow:hidden}
.sl::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,#000c)}
.orb{position:absolute;left:50%;top:40%;width:170px;height:170px;margin:-85px;border-radius:50%;border:1px solid #fff8;animation:pu2 3.2s ease-in-out infinite}
.orb::after{content:"";position:absolute;inset:34px;border-radius:50%;border:1px solid #fffa}
@keyframes pu2{50%{transform:scale(1.25);opacity:.4}}
.cap{position:absolute;left:18px;right:90px;bottom:48px;z-index:3;text-shadow:0 1px 8px #000}
.cap p{margin:6px 0 0}
.side{position:absolute;right:14px;bottom:70px;z-index:3;display:flex;flex-direction:column;gap:20px;align-items:center}
.side button{width:52px;height:52px;border-radius:50%;border:0;background:#ffffff26;color:#fff;font-size:22px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.side button.on{background:#fff;color:#000}
.side small{font-size:10px}
.tkb{position:absolute;top:52px;left:14px;z-index:5;background:#0008;color:#fff;border:0;border-radius:99px;padding:6px 14px;font-size:14px;cursor:pointer}
.boot{background:#000;transition:opacity .35s}
.bx{display:flex;flex-direction:column;align-items:center;gap:34px}
.bk{width:92px;height:92px;border-radius:26px;background:#fff;display:grid;place-items:center;animation:bf .5s ease both}
@keyframes bf{from{opacity:0}}
.bt{width:110px;height:3px;border-radius:2px;background:#ffffff26;overflow:hidden}
.bt i{display:block;height:100%;width:0;background:#fff;transition:width .35s linear}
.bo{position:absolute;bottom:56px;left:0;right:0;text-align:center;color:#ffffff80;font-size:12px;letter-spacing:.5px}
.status{pointer-events:none}#clk,#sg{pointer-events:auto;cursor:pointer}
.ic{border:0;border-radius:21px;padding:15px;box-shadow:inset 0 1px 0 #ffffff80,inset 0 -2px 6px #0003,0 8px 16px #0005}
.ic2{border-radius:11px;box-shadow:inset 0 1px 0 #ffffff70}
.tst{position:absolute;top:8px;left:12px;right:12px;z-index:15;padding:10px 14px;display:flex;gap:10px;align-items:center;transform:translateY(-140%);transition:transform .5s cubic-bezier(.2,.9,.2,1);background:rgba(30,30,32,.8);color:#fff;--ln:#ffffff22}
.tst.in{transform:none}.tst small{opacity:.7}
.cc{position:absolute;top:60px;left:14px;right:14px;z-index:12;padding:18px;transform:translateY(-130%);transition:transform .45s cubic-bezier(.2,.9,.2,1);background:rgba(28,28,30,.85);color:#fff;--ln:#ffffff22}
.cc.in{transform:none}.cc label{color:#fff}.cc input{padding:0;height:30px;margin:6px 0 12px}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.cg button{padding:16px;border-radius:18px;border:0;background:#ffffff1f;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.cg button.on{background:#fff;color:#000}
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:14}
.ch{height:440px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px;scrollbar-width:none}
.b{max-width:80%;padding:10px 14px;border-radius:20px;line-height:1.35;font-size:15px;white-space:pre-wrap}
.b.u{align-self:flex-end;background:var(--fg);color:var(--inv)}.b.a{align-self:flex-start;background:var(--g2)}
.pgl{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.pgl img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:pointer}
.ov{position:absolute;inset:0;background:#000e;z-index:11;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff}
.ov img{max-width:92%;max-height:70%;border-radius:12px}
.vf{aspect-ratio:3/4;background:#000;border-radius:24px;overflow:hidden;margin-bottom:16px}
.vf video{width:100%;height:100%;object-fit:cover}
.shut{width:72px;height:72px;border-radius:50%;border:4px solid var(--fg);background:var(--fg);box-shadow:inset 0 0 0 4px var(--inv);cursor:pointer}
.shut:active{transform:scale(.92)}
</style>
</head>
<body>
<div class="phone" id="ph">
  <button class="island" id="isl" aria-label="Verrouiller"></button>
  <div class="status"><span id="clk"></span><span id="sg">●●●● ▮</span></div>
  <div class="screen" id="scr"></div>
  <div class="homebar" id="hb"></div>
  <div class="boot" id="boot"><div class="bx"><div class="bk"><svg style="width:54px;height:54px" viewBox="0 0 24 24"><path fill="#000" d="M6 3h3.4v7.2L15.2 3h4.3l-6.4 8 6.9 10h-4.2l-5-7.6-.9 1V21H6z"/></svg></div><div class="bt"><i id="bi"></i></div></div><div class="bo">Krov3x OS</div></div>
</div>
<script>
const WP={noir:['radial-gradient(120% 80% at 30% 0%,#2e2e30,#000 65%)',0],graphite:['linear-gradient(165deg,#48484a,#0b0b0c)',0],brume:['linear-gradient(165deg,#fafafa,#aeaeb2)',1],blanc:['radial-gradient(120% 80% at 70% 0%,#fff,#d1d1d6 80%)',1]};
const I={
settings:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
store:'<path d="M5 8h14l-1 12H6zM9 8a3 3 0 016 0"/>',
calc:'<rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/>',
notes:'<path d="M5 4h14v16H5zM8 9h8M8 13h8M8 17h4"/>',
chrono:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2.5h6"/>',
guess:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
ttt:'<path d="M9 3v18M15 3v18M3 9h18M3 15h18"/>'};
const APPS={settings:['Réglages','Personnalise ton téléphone',1],store:['App Store','Télécharge des apps',1],calc:['Calculatrice','Calculs de base',1],notes:['Notes','Écris et garde tes idées',0],chrono:['Chrono','Chronomètre précis',0],guess:['Devine','Trouve le nombre entre 1 et 100',0],ttt:['Morpion','Défie l\u2019ordinateur',0]};
Object.assign(I,{google:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/>',tiktok:'<circle cx="8" cy="17" r="3"/><path d="M11 17V5c1 3 3 4 6 4"/>',draw:'<path d="M4 20l1-4L16 5l3 3L8 19zM14 7l3 3"/>'});
Object.assign(APPS,{google:['Google','Recherche sur le web',0],tiktok:['TikTok','Vidéos courtes, likes et abonnements',0],draw:['Dessin','Dessine, ton dessin est gardé',0]});
const DOCK=['settings','store','calc'];
const $=s=>document.querySelector(s),ph=$('#ph'),scr=$('#scr');
let S=null,locked=true,T=[],buf='',wp='noir',ce='';
for(const k of['pyos','pyos_bak']){try{const v=JSON.parse(localStorage.getItem(k));if(v&&typeof v=='object'){S=v;break}}catch(e){}}
const D=()=>({v:2,p:null,apps:[...DOCK,'cam'],notes:[],hist:[],chat:[],contacts:[],cm:{},cc:{wifi:1,bt:1,air:0,dnd:0,br:100},likes:{},fol:{},draw:'',tk:0,seen:0});
const norm=()=>{S=Object.assign(D(),S&&typeof S=='object'?S:{});S.apps=[...new Set([...DOCK,...(S.apps||[]).filter(a=>APPS[a]||a=='cam')])];S.v=2};norm();
const save=()=>{try{const o=localStorage.getItem('pyos');if(o)localStorage.setItem('pyos_bak',o);localStorage.setItem('pyos',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const H=async(p,s)=>{try{return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p)))].map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(s+p)}};
function show(h){T.forEach(clearInterval);T=[];if(window._cs){window._cs.getTracks().forEach(t=>t.stop());window._cs=null}scr.style.animation='none';scr.offsetHeight;scr.style.animation='';scr.innerHTML=h;scr.scrollTop=0}
function setWall(k){wp=k;ph.style.background=WP[k][0];ph.classList.toggle('light',!!WP[k][1])}
function tick(){const d=new Date(),t=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),l=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});$('#clk').textContent=t;['lt','wt'].forEach(i=>{const e=$('#'+i);if(e)e.textContent=t});['ld','wdd'].forEach(i=>{const e=$('#'+i);if(e)e.textContent=l})}
setInterval(tick,1000);
const sw=()=>Object.keys(WP).map(k=>`<i class="${k==wp?'on':''}" style="background:${WP[k][0]}" onclick="pick('${k}')"></i>`).join('');
function pick(k){setWall(k);if(S.p){S.p.wp=k;save()}document.querySelectorAll('.sw').forEach(e=>e.innerHTML=sw())}
const hd=(t,b='home()',l='Accueil')=>`<div class="hd"><button class="bk" onclick="${b}">‹ ${l}</button><h2>${t}</h2></div>`;
const msg=t=>{const e=$('#e');if(e)e.textContent=t};
const tile=a=>`<button class="app" onclick="go('${a}')"><span class="ic" style="${tl(a)}">${ic(a)}</span><small>${APPS[a][0]}</small></button>`;

/* ---------- Profil ---------- */
function setup(){locked=true;setWall('noir');show(`<div class="ctr"><div class="logo">${ic('settings')}</div><h1>Krov3x OS</h1><p class="sub">Bienvenue ! Crée ton profil pour commencer</p>
<input id="n" placeholder="Prénom" maxlength="20" autocomplete="off">
<input id="a" type="password" inputmode="numeric" maxlength="6" placeholder="Code (4 à 6 chiffres)">
<input id="b" type="password" inputmode="numeric" maxlength="6" placeholder="Confirme le code">
<div class="sw">${sw()}</div><button class="pri" onclick="mk()">Continuer</button><div class="err" id="e"></div></div>`)}
async function mk(){const n=$('#n').value.trim(),a=$('#a').value,b=$('#b').value;
if(!n)return msg('Entre ton prénom.');
if(!/^\d{4,6}$/.test(a))return msg('Le code doit contenir 4 à 6 chiffres.');
if(a!=b)return msg('Les codes ne correspondent pas.');
const s=Math.random().toString(36).slice(2);
S.p={n,s,h:await H(a,s),l:a.length,wp,num:String(1e7+Math.random()*9e7|0)};save();locked=false;home();reg()}

/* ---------- Verrouillage ---------- */
function lock(){locked=true;buf='';setWall(S.p.wp);show(`<div class="lk"><div class="ld" id="ld"></div><div class="lt" id="lt"></div><div class="hi">Bonjour ${esc(S.p.n)}</div>${S.seen?`<div class="err">Dernière connexion ${new Date(S.seen).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>`:''}<div class="dots" id="dt"></div><div class="err" id="e">Entre ton code</div>
<div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button onclick="key('${k}')">${k}</button>`).join('')}</div></div>`);dots();tick()}
const dots=()=>{$('#dt').innerHTML=Array.from({length:S.p.l},(_,i)=>`<i class="${i<buf.length?'f':''}"></i>`).join('')};
async function key(k){if(k=='⌫')buf=buf.slice(0,-1);else if(buf.length<S.p.l)buf+=k;dots();
if(buf.length==S.p.l){if(await H(buf,S.p.s)==S.p.h){locked=false;S.seen=Date.now();save();home();toast('Krov3x OS','Content de te revoir, '+S.p.n)}else{buf='';const d=$('#dt');d.classList.add('sh');msg('Code incorrect');setTimeout(()=>{d.classList.remove('sh');dots()},450)}}}

/* ---------- Accueil ---------- */
function home(){if(locked)return;setWall(S.p.wp);
show(`<div class="hm"><div class="wd glass"><div class="wdd" id="wdd"></div><div class="wt" id="wt"></div><div class="wf"><span>Salut ${esc(S.p.n)}</span><button class="sm o" onclick="lock()">Verrouiller</button></div></div>
<div class="gr">${S.apps.filter(a=>!DOCK.includes(a)).map(tile).join('')}</div></div><div class="dock glass">${DOCK.map(tile).join('')}</div>`);tick()}
function go(a){if(!locked)A[a]()}
$('#hb').onclick=()=>locked||home();
$('#isl').onclick=()=>{if(!locked&&S.p)lock()};

/* ---------- Applications ---------- */
const A={
settings(){show(`${hd('Réglages')}
<div class="list glass"><div class="pd"><label>Prénom</label><input id="n" value="${esc(S.p.n)}"><button class="sm" onclick="rn()">Enregistrer</button></div></div>
